# Spring Boot Configuration for SmartBus
spring.application.name=SmartBus
server.port=8080
server.address=0.0.0.0

# Active Profile: dev (H2 MySQL mode for zero-setup execution), switch to 'mysql' when running MySQL
spring.profiles.active=dev

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SMARTBUS_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# JPA Common Settings
spring.jpa.open-in-view=false

# SmartBus System Settings
smartbus.gps.signal-timeout-seconds=30
smartbus.gps.offline-timeout-seconds=60
smartbus.gps.api-key=${SMARTBUS_GPS_API_KEY:}
smartbus.driver.aadhaar-hmac-key=${SMARTBUS_AADHAAR_HMAC_KEY:}
smartbus.fare.base-rate-per-km=2.50
smartbus.fare.minimum-fare=15.00

# Local-only LLM for open-ended assistant questions; Ollama must listen on loopback.
smartbus.assistant.ollama.base-url=${SMARTBUS_OLLAMA_BASE_URL:http://127.0.0.1:11434}
smartbus.assistant.ollama.model=${SMARTBUS_OLLAMA_MODEL:qwen2.5:3b}
# Ollama web search uses this key only for current-information queries.
smartbus.assistant.ollama.api-key=${OLLAMA_API_KEY:}
