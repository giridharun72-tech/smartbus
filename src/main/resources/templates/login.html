<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SmartBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-bus-front-fill fs-1 text-primary"></i>
                        <span class="fs-2 fw-bold text-dark">SmartBus</span>
                    </a>
                    <p class="text-muted" th:text="${driverLogin == true ? 'Sign in with your Driver ID and password' : 'Sign in to your transport operations portal'}">Sign in to your transport operations portal</p>
                </div>

                <div class="card shadow-sm p-4 border-0">
                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> You have logged out successfully.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form action="/login" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold" th:text="${driverLogin == true ? 'Driver ID' : 'Username, Email, or Driver ID'}">Username, Email, or Driver ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control" maxlength="100" autocomplete="username" th:placeholder="${driverLogin == true ? 'Enter your Driver ID' : 'Enter your username or email'}" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" maxlength="72" autocomplete="current-password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Sign In</button>
                    </form>

                    <div class="text-center mb-3">
                        <a href="/driver/login" class="small fw-semibold text-decoration-none"><i class="bi bi-steering-wheel"></i> Driver login with Driver ID</a>
                    </div>

                </div>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0" th:unless="${driverLogin == true}">Don't have an account? <a href="/register" class="text-primary fw-bold text-decoration-none">Register as Passenger</a></p>
                    <p class="text-muted mb-0" th:if="${driverLogin == true}"><a href="/login" class="text-primary fw-bold text-decoration-none">Back to main login</a></p>
                    <p class="mt-2"><a href="/guest/search" class="text-secondary small text-decoration-none"><i class="bi bi-eye"></i> Continue as Guest</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site-chatbot.js"></script>
</body>
</html>
