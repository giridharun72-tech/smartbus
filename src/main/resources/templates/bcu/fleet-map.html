<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCU Live Fleet Map – SmartBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top shadow border-bottom border-secondary">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/bcu/dashboard">
                <i class="bi bi-cpu-fill fs-4 text-info"></i>
                <span class="fs-4 fw-bold">BCU Fleet Dispatch Map</span>
            </a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/bcu/dashboard"><i class="bi bi-arrow-left"></i> Dashboard</a>
                <a class="nav-link active" href="#"><i class="bi bi-map"></i> Fullscreen Fleet Map</a>
                <a class="nav-link" href="/bcu/signal-monitor"><i class="bi bi-broadcast-pin"></i> Signal Monitor</a>
            </div>
            <div class="d-flex gap-2">
                <span class="badge bg-success py-2 px-3"><i class="bi bi-circle-fill"></i> Realtime WebSocket</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-3">
        <div id="bcu-live-alerts"></div>
        <div class="card bg-black border border-secondary p-2 shadow-lg">
            <div id="fleet-map" style="height: 720px; border-radius: 8px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/bcu-fleet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initBcuFleetMap);
    </script>
</body>
</html>
