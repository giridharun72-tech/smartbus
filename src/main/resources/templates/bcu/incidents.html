<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Management – BCU SmartBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top shadow border-bottom border-secondary">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/bcu/dashboard">
                <i class="bi bi-cpu-fill fs-4 text-info"></i>
                <span class="fs-4 fw-bold">BCU Incident Log</span>
            </a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/bcu/dashboard"><i class="bi bi-arrow-left"></i> Dashboard</a>
                <a class="nav-link active" href="#"><i class="bi bi-exclamation-triangle"></i> Incidents</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card bg-secondary text-white p-3 border-0">
            <h5 class="fw-bold mb-3"><i class="bi bi-journal-text text-warning"></i> Operational Incident Register</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Incident Ref</th>
                            <th>Bus</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Reported At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inc : ${incidents}">
                            <td><strong class="text-info" th:text="${inc.incidentReference}">INC-2026-001</strong></td>
                            <td th:text="'Bus ' + ${inc.bus.busNumber}">Bus 11D</td>
                            <td><span class="badge bg-warning text-dark" th:text="${inc.type}">DELAY</span></td>
                            <td th:text="${inc.description}">Road work delay</td>
                            <td><span class="badge bg-danger" th:text="${inc.priority}">MEDIUM</span></td>
                            <td><span class="badge bg-secondary" th:text="${inc.status}">OPEN</span></td>
                            <td th:text="${inc.reportedAt}">2026-09-01</td>
                            <td>
                                <button th:if="${inc.status.name() != 'RESOLVED'}" class="btn btn-sm btn-success" th:onclick="'resolveIncident(' + ${inc.id} + ')'"><i class="bi bi-check"></i> Resolve</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        function resolveIncident(id) {
            fetch(`/api/bcu/incidents/${id}/resolve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resolution: 'Resolved by BCU Dispatch Officer' })
            })
            .then(r => r.json())
            .then(d => {
                showToast(d.message, 'success');
                setTimeout(() => location.reload(), 1000);
            });
        }
    </script>
</body>
</html>
