<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management – SmartBus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/dashboard">
                <i class="bi bi-shield-lock-fill fs-4 text-warning"></i>
                <span class="fs-4 fw-bold">SmartBus Admin</span>
            </a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/admin/dashboard"><i class="bi bi-arrow-left"></i> Dashboard</a>
                <a class="nav-link active" href="/admin/buses"><i class="bi bi-bus-front"></i> Fleet Management</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card p-4 shadow-sm border-0 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="fw-bold mb-1"><i class="bi bi-bus-front-fill text-primary"></i> Registered Bus Fleet</h4>
                    <p class="text-muted small mb-0">Total Fleet: <strong id="fleet-count" th:text="${#lists.size(buses)}">10</strong> buses</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-outline-primary" href="/admin/phone-gps"><i class="bi bi-phone me-1"></i> Share Phone GPS</a>
                    <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#addBusModal">
                        <i class="bi bi-plus-circle me-1"></i> Add New Bus
                    </button>
                </div>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Bus Number</th>
                            <th>Registration</th>
                            <th>Type</th>
                            <th>Capacity</th>
                            <th>Assigned Route</th>
                            <th>Driver</th>
                            <th>GPS Device ID</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${buses}" th:attr="data-bus-id=${b.id}">
                            <td><strong class="text-primary" th:text="${b.busNumber}">21A</strong></td>
                            <td th:text="${b.registrationNumber}">TN-37-N-8821</td>
                            <td><span class="badge bg-secondary" th:text="${b.busType}">STANDARD</span></td>
                            <td th:text="${b.capacity} + ' seats'">40 seats</td>
                            <td th:text="${b.route != null ? b.route.name : 'Route 5'}">Route 5</td>
                            <td th:text="${b.driver != null ? b.driver.fullName : (b.assignedDriverName != null ? b.assignedDriverName : 'Unassigned')}">Murugan K</td>
                            <td><code th:text="${b.gpsDeviceId}">GPS-DEV-21A</code></td>
                            <td><span th:class="'status-badge status-' + ${b.status}" th:text="${b.status}">RUNNING</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" th:onclick="'updateStatus(' + ${b.id} + ', \'CANCELLED\')'"><i class="bi bi-x-circle"></i> Cancel Bus</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addBusModal" tabindex="-1" aria-labelledby="addBusModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="addBusForm">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="addBusModalLabel"><i class="bi bi-bus-front-fill text-primary me-2"></i>Add New Bus</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="locationAlert" class="alert alert-warning d-none" role="alert"></div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="busNumber" class="form-label">Bus Number</label>
                                <input id="busNumber" name="busNumber" class="form-control" type="text" placeholder="Bus 25B" maxlength="30" required>
                            </div>
                            <div class="col-md-6">
                                <label for="route" class="form-label">Route</label>
                                <input id="route" name="route" class="form-control" type="text" placeholder="Gandhipuram - Ukkadam Express" maxlength="100" required>
                            </div>
                            <div class="col-md-6">
                                <label for="driverName" class="form-label">Driver Name</label>
                                <input id="driverName" name="driverName" class="form-control" type="text" placeholder="Ramesh K" maxlength="100" required>
                            </div>
                            <div class="col-md-6">
                                <label for="totalSeats" class="form-label">Total Seats</label>
                                <input id="totalSeats" name="totalSeats" class="form-control" type="number" min="1" value="40" required>
                            </div>
                            <div class="col-md-6">
                                <label for="latitude" class="form-label">Latitude</label>
                                <input id="latitude" name="latitude" class="form-control" type="text" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label for="longitude" class="form-label">Longitude</label>
                                <input id="longitude" name="longitude" class="form-control" type="text" readonly required>
                            </div>
                            <div class="col-12 d-flex flex-wrap align-items-center gap-2">
                                <button id="getDeviceLocation" class="btn btn-outline-primary" type="button">
                                    <i class="bi bi-geo-alt-fill me-1"></i> Get Device Location
                                </button>
                                <span id="gpsLockBadge" class="badge bg-secondary d-none" aria-live="polite"></span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button id="saveBusButton" type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Bus</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/admin-buses.js"></script>
    <script>
        function updateStatus(busId, status) {
            if (!confirm(`Are you sure you want to mark this bus as ${status}? Subscribed passengers will be automatically notified.`)) return;
            fetch(`/api/admin/buses/${busId}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            })
            .then(r => r.json())
            .then(data => {
                showToast(`Bus ${data.busNumber} updated to ${data.status}. Passengers notified!`, 'success');
                setTimeout(() => location.reload(), 1200);
            });
        }
    </script>
</body>
</html>
