services:
  - type: web
    name: smartbus
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /guest/search
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SMARTBUS_COOKIE_SECURE
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SMARTBUS_AADHAAR_HMAC_KEY
        sync: false